[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "severtest"
version = "0.1.0"
description = "SunnyIsland server-side test condition builder"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
severtest = "severtest.cli:main"
severtest-api = "severtest.server:main"

[tool.setuptools.packages.find]
where = ["src"]
